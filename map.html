<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基隆實境解謎 - 基鷹德冒險</title>
    <style>
        /* --- 基礎設定 --- */
        body { margin: 0; padding: 20px; background-color: #2c3e50; font-family: "Microsoft JhengHei", sans-serif; text-align: center; color: white; }
        
        /* --- 地圖容器 --- */
        #map-container {
            position: relative;
            display: inline-block;
            max-width: 100%;
            border: 4px solid #fff;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            overflow: hidden;
            cursor: default;
            user-select: none; 
            -webkit-user-select: none; 
            /* 移除點擊高亮色 */
            -webkit-tap-highlight-color: transparent;
        }

        #map-image {
            display: block;
            max-width: 100%;
            height: auto;
            pointer-events: none;
        }

        /* --- 基鷹德人物容器 --- */
        #hero-wrapper {
            position: absolute;
            width: 20%; 
            left: 82.1%; top: 64.5%; /* 起點 */
            transform: translate(-50%, -50%);
            z-index: 30; /* 最上層 */
            
            /* 讓整個區域(含氣泡)都可以點 */
            cursor: pointer;
        }

        #hero {
            width: 100%;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5));
            transition: transform 0.2s;
            pointer-events: auto;
        }
        #hero:active { transform: scale(0.9); }

        /* --- 提示氣泡 --- */
        .speech-bubble {
            position: absolute;
            top: -55px; 
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            color: #d35400; 
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 900;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 2px solid #d35400;
            pointer-events: auto; /* 氣泡可點擊 */
            animation: bounce 1s infinite alternate;
        }
        
        .speech-bubble::after { 
            content: ''; position: absolute; bottom: -8px; left: 50%;
            margin-left: -8px; border-width: 8px 8px 0; border-style: solid;
            border-color: #d35400 transparent;
        }

        @keyframes bounce {
            from { transform: translateX(-50%) translateY(0); }
            to { transform: translateX(-50%) translateY(-6px); }
        }

        /* --- 互動熱點 --- */
        .hotspot {
            position: absolute;
            width: 5%; height: 7%;
            background-color: rgba(255, 255, 0, 0.3);
            border: 2px solid yellow;
            border-radius: 50%;
            cursor: pointer;
            z-index: 15;
            transform: translate(-50%, -50%);
            animation: pulse 2s infinite;
        }
        
        .hotspot-label {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            white-space: nowrap;
            pointer-events: none;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 0, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 255, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 0, 0); }
        }

        /* --- 彈出視窗 --- */
        #modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85); z-index: 100;
            justify-content: center; align-items: center;
        }
        .modal-content {
            background-color: #fff; color: #333; width: 90%; max-width: 480px;
            max-height: 80vh; overflow-y: auto; padding: 25px;
            border-radius: 12px; text-align: left; position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .modal-header { font-size: 1.4em; font-weight: bold; color: #d35400; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .modal-text { font-size: 1rem; line-height: 1.6; margin-bottom: 20px; }
        .mission-box { background-color: #e8f8f5; border-left: 5px solid #1abc9c; padding: 15px; border-radius: 4px; margin-bottom: 10px; }
        .mission-title { color: #16a085; font-weight: bold; display: block; margin-bottom: 5px; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 28px; font-weight: bold; color: #aaa; cursor: pointer; }
        
        /* --- Debug 面板 --- */
        #debug-panel { display: none; position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.9); color: #0f0; padding: 10px; font-family: monospace; font-size: 14px; z-index: 999; }
    </style>
</head>
<body>

    <h2>🦅 基鷹德：基隆實境解謎</h2>
    <p style="font-size:0.9em; color:#ccc;">👇 點擊黃色圈圈接任務，點擊基鷹德開始移動！</p>

    <div id="debug-panel">點擊位置: <span id="coord-display">--</span></div>

    <div id="map-container">
        <img src="宜蘭路線圖.jpg" id="map-image" alt="地圖">
        
        <div id="hero-wrapper">
            <div id="bubble" class="speech-bubble">點我出發！</div>
            <img src="基鷹德.jpg" id="hero" title="點我走路！">
        </div>

        <div class="hotspot" style="left: 78.5%; top: 51.2%;" onclick="openModal(2)"><span class="hotspot-label">任務點</span></div> 
        <div class="hotspot" style="left: 89.1%; top: 37.1%;" onclick="openModal(3)"><span class="hotspot-label">任務點</span></div> 
        <div class="hotspot" style="left: 93.9%; top: 47.9%;" onclick="openModal(4)"><span class="hotspot-label">參觀</span></div> 
        <div class="hotspot" style="left: 83.8%; top: 61.6%;" onclick="openModal(5)"><span class="hotspot-label">任務點</span></div> 
        <div class="hotspot" style="left: 72.4%; top: 23.3%;" onclick="openModal(6)"><span class="hotspot-label">終點</span></div> 
    </div>

    <div id="modal-overlay"><div class="modal-content"><span class="close-btn" onclick="closeModal()">&times;</span><div id="modal-body"></div></div></div>

    <script>
        const debugMode = false;

        // 1. 路徑點
        const waypoints = [
            { left: '83.4%', top: '66.2%' },
            { left: '78.3%', top: '61.6%' },
            { left: '81.3%', top: '52.5%' },
            { left: '89.1%', top: '37.1%' },
            { left: '91.2%', top: '38.7%' },
            { left: '93.9%', top: '47.9%' },
            { left: '83.8%', top: '61.6%' },
            { left: '63.8%', top: '45.4%' },
            { left: '72.4%', top: '23.3%' } 
        ];

        // 2. 景點資料
        const locationData = {
            2: { title: "📍 2. 義二路商圈", desc: "日治時期最繁華的商業街道，號稱基隆銀座。", missions: ["尋找巷口特殊造型路燈，猜猜看它是什麼植物造型？"] },
            3: { title: "📍 3. 基隆塔", desc: "2023年新地標，橋式起重機造型。", missions: ["在觀景台拍下三項你最喜歡的基隆景色。"] },
            4: { title: "📍 4. 主普壇", desc: "中元普渡主要場所，八角形建築。", missions: ["(本站純欣賞，無特定任務)"] },
            5: { title: "📍 5. 信二防空洞", desc: "人工開鑿，基隆最具規模的防空洞。", missions: ["觀察防空洞有什麼設施(廁所、廚房)？", "觀察牆壁岩石紋路是往哪邊傾斜？"] },
            6: { title: "📍 6. 麗都蝶客花園", desc: "基隆最美觀海平台。", missions: ["找找看有沒有一個叫『參肆行』的地方？猜猜名字由來？"] }
        };

        const heroWrapper = document.getElementById('hero-wrapper');
        const bubble = document.getElementById('bubble');
        const modalOverlay = document.getElementById('modal-overlay');
        const modalBody = document.getElementById('modal-body');
        let isMoving = false;

        // --- 人物移動 ---
        heroWrapper.addEventListener('click', async function(e) {
            // 🔥 這裡移除了原本的 isResizing 檢查
            if (isMoving || debugMode) return;
            
            isMoving = true;
            bubble.style.display = 'none'; 
            
            const animation = heroWrapper.animate(
                waypoints.map(pt => ({ left: pt.left, top: pt.top })), 
                { duration: 15000, fill: 'forwards', easing: 'linear' }
            );

            try {
                await animation.finished;
                alert("抵達終點！冒險結束 🎉");
                bubble.innerText = "再來一次";
                bubble.style.display = 'block';
            } catch (err) { console.log("動畫中斷"); }
            
            isMoving = false;
        });

        // --- 彈出視窗 ---
        function openModal(id) {
            if(debugMode) return;
            const data = locationData[id];
            if (!data) return;
            let mHtml = data.missions.map((m,i) => `<div class="mission-box"><span class="mission-title">任務 ${i+1}</span>${m}</div>`).join('');
            modalBody.innerHTML = `<div class="modal-header">${data.title}</div><div class="modal-text">${data.desc}</div>${mHtml}`;
            modalOverlay.style.display = 'flex';
        }
        function closeModal() { modalOverlay.style.display = 'none'; }
        modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });

        // --- Debug 模式 ---
        if (debugMode) {
            document.getElementById('debug-panel').style.display = 'block';
            document.getElementById('map-container').style.cursor = 'crosshair';
            document.getElementById('map-container').addEventListener('click', function(e) {
                if(e.target !== document.getElementById('map-image')) return;
                const rect = this.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width * 100).toFixed(1);
                const y = ((e.clientY - rect.top) / rect.height * 100).toFixed(1);
                const code = `{ left: '${x}%', top: '${y}%' }`;
                document.getElementById('coord-display').innerText = code;
                navigator.clipboard.writeText(code);
            });
        }
    </script>
</body>
</html>
